<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABMDCAT Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5fbff;
      color: #111;
    }

    header {
      background: #0ea5e9;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .logout {
      background: white;
      color: #0ea5e9;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .welcome,
    .profile,
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .welcome {
      padding: 22px;
      margin-bottom: 25px;
    }

    .welcome h2,
    .profile h2 {
      margin-top: 0;
    }

    .profile {
      padding: 22px;
      margin-bottom: 25px;
    }

    .profile p {
      margin: 10px 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .card {
      padding: 22px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #555;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
      color: #0ea5e9;
    }

    .message {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>ABMDCAT Admin Dashboard</h1>

  <button class="logout" onclick="logout()">
    Logout
  </button>
</header>

<div class="container">

  <!-- Dashboard Welcome -->

  <div class="welcome">

    <h2>Welcome, Super Admin</h2>

    <p id="welcomeMessage">
      Loading dashboard...
    </p>

  </div>


  <!-- Admin Profile -->

  <div class="profile">

    <h2>Admin Profile</h2>

    <p>
      <strong>Username:</strong>
      <span id="profileUsername">Loading...</span>
    </p>

    <p>
      <strong>Full Name:</strong>
      <span id="profileFullname">Loading...</span>
    </p>

  </div>


  <!-- Statistics -->

  <div class="cards">

    <div class="card">

      <h3>Total Students</h3>

      <div
        class="number"
        id="students">
        0
      </div>

    </div>


    <div class="card">

      <h3>Total MCQs</h3>

      <div
        class="number"
        id="mcqs">
        0
      </div>

    </div>


    <div class="card">

      <h3>Total Tests</h3>

      <div
        class="number"
        id="tests">
        0
      </div>

    </div>


    <div class="card">

      <h3>Total Notes</h3>

      <div
        class="number"
        id="notes">
        0
      </div>

    </div>


    <div class="card">

      <h3>Total Results</h3>

      <div
        class="number"
        id="results">
        0
      </div>

    </div>

  </div>


  <p
    class="message"
    id="status">
  </p>

</div>


<script>

async function loadDashboard() {

  try {

    // -----------------------------
    // Dashboard
    // -----------------------------

    const dashboardResponse =
      await fetch("/api/admin/dashboard");

    const dashboard =
      await dashboardResponse.json();

    if (dashboard.success) {

      document.getElementById(
        "welcomeMessage"
      ).textContent = dashboard.message;

    }


    // -----------------------------
    // Profile
    // -----------------------------

    const profileResponse =
      await fetch("/api/admin/profile");

    const profile =
      await profileResponse.json();

    if (profile.success && profile.admin) {

      document.getElementById(
        "profileUsername"
      ).textContent =
        profile.admin.username || "Not available";

      document.getElementById(
        "profileFullname"
      ).textContent =
        profile.admin.fullname || "Not available";

    }


    // -----------------------------
    // Statistics
    // -----------------------------

    const statisticsResponse =
      await fetch("/api/admin/statistics");

    const statistics =
      await statisticsResponse.json();


    document.getElementById(
      "students"
    ).textContent =
      statistics.totalStudents ?? 0;


    document.getElementById(
      "mcqs"
    ).textContent =
      statistics.totalMcqs ?? 0;


    document.getElementById(
      "tests"
    ).textContent =
      statistics.totalTests ?? 0;


    document.getElementById(
      "notes"
    ).textContent =
      statistics.totalNotes ?? 0;


    document.getElementById(
      "results"
    ).textContent =
      statistics.totalResults ?? 0;


  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "Unable to load dashboard data.";

  }

}


// -----------------------------
// Logout
// -----------------------------

async function logout() {

  try {

    await fetch(
      "/api/admin/logout",
      {
        method: "POST"
      }
    );

  } catch (error) {

    console.error(
      "Logout error:",
      error
    );

  }

  window.location.href = "/";

}


// Load everything

loadDashboard();

</script>

</body>
</html>
